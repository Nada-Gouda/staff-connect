{% extends "base.html" %}

{% block content %}

<h1>{{ post.title }}</h1>

<p>{{ post.body }}</p>

<p>By {{ post.author }}</p>

{% if user == post.author %}
    <a href="{% url 'post-update' post.slug %}">Edit</a>
    <a href="{% url 'post-delete' post.slug %}">Delete</a>
{% endif %}

<a href="{% url 'home' %}">Back to Home</a>

{% endblock %}
